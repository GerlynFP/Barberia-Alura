<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 827 40" width="827" height="40" role="img" aria-label="HTML5, CSS3, JavaScript, responsivo, animaciones, accesible">
<style>@font-face{font-family:M;font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:M,Montserrat,Arial,sans-serif;font-weight:700;font-size:15px;fill:#fff}
.p{opacity:0;animation:in .6s cubic-bezier(.23,1,.32,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.p{animation:none;opacity:1}}</style>
<g transform="translate(0 0)"><g class="p" style="animation-delay:0ms"><rect width="92" height="40" rx="20" fill="#161616"/><circle cx="20" cy="20" r="6" fill="#e34f26"/><text x="34" y="26">HTML5</text></g></g><g transform="translate(104 0)"><g class="p" style="animation-delay:90ms"><rect width="80" height="40" rx="20" fill="#161616"/><circle cx="20" cy="20" r="6" fill="#2965f1"/><text x="34" y="26">CSS3</text></g></g><g transform="translate(196 0)"><g class="p" style="animation-delay:180ms"><rect width="149" height="40" rx="20" fill="#161616"/><circle cx="20" cy="20" r="6" fill="#f7df1e"/><text x="34" y="26">JavaScript</text></g></g><g transform="translate(356 0)"><g class="p" style="animation-delay:270ms"><rect width="149" height="40" rx="20" fill="#161616"/><circle cx="20" cy="20" r="6" fill="#c78c19"/><text x="34" y="26">Responsivo</text></g></g><g transform="translate(518 0)"><g class="p" style="animation-delay:360ms"><rect width="160" height="40" rx="20" fill="#161616"/><circle cx="20" cy="20" r="6" fill="#c78c19"/><text x="34" y="26">Animaciones</text></g></g><g transform="translate(690 0)"><g class="p" style="animation-delay:450ms"><rect width="138" height="40" rx="20" fill="#161616"/><circle cx="20" cy="20" r="6" fill="#c78c19"/><text x="34" y="26">Accesible</text></g></g></svg>